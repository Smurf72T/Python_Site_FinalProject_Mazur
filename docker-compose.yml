services:
  # ============================================
  # Nginx - Reverse Proxy
  # ============================================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: rental_nginx
    ports:
      - "80:80"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      backend:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - rental_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # База данных (PostgreSQL)
  # ============================================
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: rental_db
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # из .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db_init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    networks:
      - rental_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================
  # Backend (основное приложение)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rental_backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/rental_db  # из .env
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENABLE_ADMIN_URL: "False"  # Отключаем админку в backend
      DEBUG: "False"  # Режим разработки выключен
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rental_network

  # ============================================
  # Django Admin (отдельный контейнер)
  # ============================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: rental_admin
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/rental_db  # из .env
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENABLE_ADMIN_URL: "True"  # Включаем админку в admin контейнере
      DEBUG: "False"  # Режим разработки выключен
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - rental_network

  # ============================================
  # Тесты (автоматический запуск после старта)
  # ============================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: rental_tests
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/rental_db  # из .env
      PYTEST_ADDOPTS: "--cov=apps --cov-report=html:/app/test_results/htmlcov --cov-report=term-missing"
    volumes:
      - ./test_results:/app/test_results
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - rental_network
    # Тесты запускаются автоматически при старте контейнера
    # Контейнер завершится после выполнения тестов
    restart: "no"

networks:
  rental_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
