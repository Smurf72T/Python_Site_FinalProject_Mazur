{% extends 'base.html' %}
{% block title %}Вход - Аренда Одежды{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="fw-bold">С возвращением!</h2>
                    <p class="text-muted">Войдите в свой аккаунт</p>
                </div>

                <form method="post" action="{% url 'users:login' %}">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle"></i>
                            Неверное имя пользователя или пароль.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">
                            <i class="bi bi-person"></i> Имя пользователя
                        </label>
                        <input type="text" name="username" class="form-control form-control-lg" 
                               id="id_username" placeholder="Введите имя пользователя" required 
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">
                            <i class="bi bi-lock"></i> Пароль
                        </label>
                        <input type="password" name="password" class="form-control form-control-lg" 
                               id="id_password" placeholder="Введите пароль" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-2 text-muted">Нет аккаунта?</p>
                    <a href="{% url 'users:register' %}" class="btn btn-outline-primary">
                        <i class="bi bi-person-plus"></i> Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
